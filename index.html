<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Photo Collage</title>
  <style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  background: #f3f4f6;
  color: #1f2937;
}
header { text-align: center; padding: 28px 16px 8px; }
header h1 { margin: 0 0 6px; font-size: 1.8rem; }
header p { margin: 0; color: #6b7280; }

main {
  display: grid;
  grid-template-columns: minmax(280px, 380px) 1fr;
  gap: 20px;
  max-width: 1100px;
  margin: 20px auto;
  padding: 0 16px 40px;
}
@media (max-width: 820px) { main { grid-template-columns: 1fr; } }

.panel {
  background: #fff;
  border-radius: 14px;
  padding: 18px;
  box-shadow: 0 1px 4px rgba(0,0,0,.08);
}

.dropzone {
  display: block;
  border: 2px dashed #9ca3af;
  border-radius: 12px;
  padding: 26px 14px;
  text-align: center;
  cursor: pointer;
  color: #4b5563;
  transition: background .15s, border-color .15s;
}
.dropzone:hover, .dropzone.drag { background: #eff6ff; border-color: #3b82f6; }

.status { font-size: .9rem; color: #6b7280; margin: 12px 0 8px; }
.status.error { color: #b91c1c; }
.status.ok { color: #047857; }

.thumbs {
  list-style: none; padding: 0; margin: 0 0 14px;
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
}
.thumbs li { position: relative; aspect-ratio: 1; border-radius: 8px; overflow: hidden; background: #e5e7eb; }
.thumbs img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumbs button {
  position: absolute; top: 3px; right: 3px;
  width: 22px; height: 22px; line-height: 20px; padding: 0;
  border: 0; border-radius: 50%;
  background: rgba(0,0,0,.65); color: #fff; cursor: pointer; font-size: 14px;
}

.controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.controls label { display: flex; align-items: center; gap: 8px; font-size: .9rem; }
.controls input[type=color] { width: 36px; height: 28px; border: 0; padding: 0; background: none; cursor: pointer; }

button {
  font: inherit; padding: 8px 14px; border-radius: 8px;
  border: 1px solid #d1d5db; background: #fff; cursor: pointer;
}
button:hover:not(:disabled) { background: #f3f4f6; }
button:disabled { opacity: .45; cursor: not-allowed; }
button.primary { background: #2563eb; border-color: #2563eb; color: #fff; margin-top: 14px; padding: 11px 20px; }
button.primary:hover:not(:disabled) { background: #1d4ed8; }

.preview { display: flex; flex-direction: column; align-items: center; }
.canvas-wrap { position: relative; width: 100%; max-width: 640px; aspect-ratio: 1; background: #e5e7eb; border-radius: 8px; overflow: hidden; }
.canvas-wrap canvas { width: 100%; height: 100%; display: none; }
.canvas-wrap.ready canvas { display: block; touch-action: none; user-select: none; }
.hint { margin: 10px 0 0; font-size: .85rem; color: #6b7280; }
.canvas-wrap.ready .placeholder { display: none; }
.placeholder { position: absolute; inset: 0; display: grid; place-items: center; margin: 0; color: #9ca3af; }
  </style>
</head>
<body>
  <header>
    <h1>Photo Collage</h1>
    <p>Upload 3–7 photos. The best-fitting template is picked automatically.</p>
  </header>

  <main>
    <section class="panel">
      <label id="dropzone" class="dropzone" for="fileInput">
        <strong>Click to choose photos</strong> or drag &amp; drop them here
        <input id="fileInput" type="file" accept="image/*" multiple hidden>
      </label>
      <p id="status" class="status">No photos yet (need 3–7).</p>
      <ul id="thumbs" class="thumbs"></ul>

      <div class="controls">
        <label>Spacing
          <input id="gap" type="range" min="0" max="60" value="16">
        </label>
        <label>Background
          <input id="bg" type="color" value="#ffffff">
        </label>
        <button id="shuffle" type="button" disabled>Try another layout</button>
        <button id="reset" type="button" disabled>Reset positions</button>
        <button id="clear" type="button" disabled>Clear all</button>
      </div>
    </section>

    <section class="panel preview">
      <div class="canvas-wrap">
        <canvas id="canvas" width="1600" height="1600"></canvas>
        <p id="placeholder" class="placeholder">Your collage will appear here</p>
      </div>
      <p class="hint">Tip: drag a photo inside the collage to choose which part of it is visible.</p>
      <button id="download" type="button" class="primary" disabled>Download collage (PNG)</button>
    </section>
  </main>

  <script>
"use strict";

const MIN_PHOTOS = 3;
const MAX_PHOTOS = 7;
const SIZE = 1600; // output collage is SIZE x SIZE pixels

// Templates: [x, y, w, h] in 0..1 units of the collage area. Keyed by photo count.
const third = 1 / 3;
const TEMPLATES = {
  3: [
    [[0, 0, 0.6, 1], [0.6, 0, 0.4, 0.5], [0.6, 0.5, 0.4, 0.5]],
    [[0, 0, 1, 0.55], [0, 0.55, 0.5, 0.45], [0.5, 0.55, 0.5, 0.45]],
  ],
  4: [
    [[0, 0, 0.5, 0.5], [0.5, 0, 0.5, 0.5], [0, 0.5, 0.5, 0.5], [0.5, 0.5, 0.5, 0.5]],
    [[0, 0, 1, 0.5], [0, 0.5, third, 0.5], [third, 0.5, third, 0.5], [2 * third, 0.5, third, 0.5]],
  ],
  5: [
    [[0, 0, 0.5, 0.5], [0.5, 0, 0.5, 0.5], [0, 0.5, third, 0.5], [third, 0.5, third, 0.5], [2 * third, 0.5, third, 0.5]],
    [[0, 0, 0.5, 1], [0.5, 0, 0.25, 0.5], [0.75, 0, 0.25, 0.5], [0.5, 0.5, 0.25, 0.5], [0.75, 0.5, 0.25, 0.5]],
  ],
  6: [
    [[0, 0, third, 0.5], [third, 0, third, 0.5], [2 * third, 0, third, 0.5],
     [0, 0.5, third, 0.5], [third, 0.5, third, 0.5], [2 * third, 0.5, third, 0.5]],
    [[0, 0, 0.5, third], [0.5, 0, 0.5, third], [0, third, 0.5, third],
     [0.5, third, 0.5, third], [0, 2 * third, 0.5, third], [0.5, 2 * third, 0.5, third]],
  ],
  7: [
    [[0, 0, 0.5, 0.4], [0.5, 0, 0.5, 0.4],
     [0, 0.4, third, 0.3], [third, 0.4, third, 0.3], [2 * third, 0.4, third, 0.3],
     [0, 0.7, 0.5, 0.3], [0.5, 0.7, 0.5, 0.3]],
    [[0, 0, third, 0.35], [third, 0, third, 0.35], [2 * third, 0, third, 0.35],
     [0, 0.35, 1, 0.3],
     [0, 0.65, third, 0.35], [third, 0.65, third, 0.35], [2 * third, 0.65, third, 0.35]],
  ],
};

const $ = (id) => document.getElementById(id);
const fileInput = $("fileInput");
const dropzone = $("dropzone");
const statusEl = $("status");
const thumbsEl = $("thumbs");
const canvas = $("canvas");
const ctx = canvas.getContext("2d");
const wrap = canvas.parentElement;
const gapInput = $("gap");
const bgInput = $("bg");
const shuffleBtn = $("shuffle");
const clearBtn = $("clear");
const resetBtn = $("reset");
const downloadBtn = $("download");

/** @type {{url: string, img: HTMLImageElement, name: string}[]} */
let photos = [];
let variant = 0;

function setStatus(text, kind = "") {
  statusEl.textContent = text;
  statusEl.className = "status " + kind;
}

function loadImage(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    // fx/fy = which part of the photo is visible: 0 = left/top edge, 0.5 = centered, 1 = right/bottom edge
    img.onload = () => resolve({ url, img, name: file.name, fx: 0.5, fy: 0.5 });
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error(file.name)); };
    img.src = url;
  });
}

async function addFiles(fileList) {
  const files = Array.from(fileList).filter((f) => f.type.startsWith("image/"));
  if (!files.length) return;
  const room = MAX_PHOTOS - photos.length;
  const accepted = files.slice(0, Math.max(room, 0));
  const skipped = files.length - accepted.length;

  const results = await Promise.allSettled(accepted.map(loadImage));
  let failed = 0;
  for (const r of results) {
    if (r.status === "fulfilled") photos.push(r.value); else failed++;
  }
  variant = 0;
  refresh();

  const notes = [];
  if (skipped) notes.push(`${skipped} photo(s) ignored (max ${MAX_PHOTOS}).`);
  if (failed) notes.push(`${failed} file(s) could not be read.`);
  if (notes.length) setStatus(statusEl.textContent + " " + notes.join(" "), "error");
}

function removePhoto(index) {
  URL.revokeObjectURL(photos[index].url);
  photos.splice(index, 1);
  variant = 0;
  refresh();
}

function renderThumbs() {
  thumbsEl.innerHTML = "";
  photos.forEach((p, i) => {
    const li = document.createElement("li");
    const img = document.createElement("img");
    img.src = p.url;
    img.alt = p.name;
    const btn = document.createElement("button");
    btn.type = "button";
    btn.title = "Remove";
    btn.textContent = "×";
    btn.addEventListener("click", () => removePhoto(i));
    li.append(img, btn);
    thumbsEl.appendChild(li);
  });
}

const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));

/** Draw the photo into the rect (x,y,w,h) using "cover" fit; photo.fx/fy choose the visible part. */
function drawCover(photo, x, y, w, h) {
  const img = photo.img;
  const scale = Math.max(w / img.naturalWidth, h / img.naturalHeight);
  const sw = w / scale;
  const sh = h / scale;
  const sx = (img.naturalWidth - sw) * photo.fx;
  const sy = (img.naturalHeight - sh) * photo.fy;
  ctx.drawImage(img, sx, sy, sw, sh, x, y, w, h);
}

function drawCollage() {
  const templates = TEMPLATES[photos.length];
  const layout = templates[variant % templates.length];
  const gap = Number(gapInput.value);

  canvas.width = SIZE;
  canvas.height = SIZE;
  ctx.fillStyle = bgInput.value;
  ctx.fillRect(0, 0, SIZE, SIZE);

  const area = SIZE - gap * 2; // outer margin equals the gap size
  cells = [];
  layout.forEach(([x, y, w, h], i) => {
    const px = gap + x * area + gap / 2;
    const py = gap + y * area + gap / 2;
    const pw = w * area - gap;
    const ph = h * area - gap;
    cells.push({ x: px, y: py, w: pw, h: ph });
    drawCover(photos[i], px, py, pw, ph);
  });
}

// ---- Drag a photo inside its cell to choose which part is visible ----
let cells = []; // last drawn cell rectangles, in canvas pixels (same order as photos)
let drag = null;

function canvasPoint(e) {
  const r = canvas.getBoundingClientRect();
  return {
    x: (e.clientX - r.left) * (canvas.width / r.width),
    y: (e.clientY - r.top) * (canvas.height / r.height),
  };
}

function cellAt(p) {
  for (let i = cells.length - 1; i >= 0; i--) {
    const c = cells[i];
    if (p.x >= c.x && p.x <= c.x + c.w && p.y >= c.y && p.y <= c.y + c.h) return i;
  }
  return -1;
}

canvas.addEventListener("pointerdown", (e) => {
  if (!wrap.classList.contains("ready")) return;
  const p = canvasPoint(e);
  const i = cellAt(p);
  if (i < 0) return;
  const photo = photos[i];
  const c = cells[i];
  const img = photo.img;
  const scale = Math.max(c.w / img.naturalWidth, c.h / img.naturalHeight);
  drag = {
    i, scale,
    startX: p.x, startY: p.y,
    fx: photo.fx, fy: photo.fy,
    rangeX: img.naturalWidth - c.w / scale,  // how many source pixels can be panned horizontally
    rangeY: img.naturalHeight - c.h / scale, // ...and vertically
  };
  canvas.setPointerCapture(e.pointerId);
  canvas.style.cursor = "grabbing";
  e.preventDefault();
});

canvas.addEventListener("pointermove", (e) => {
  const p = canvasPoint(e);
  if (!drag) {
    canvas.style.cursor = cellAt(p) >= 0 ? "grab" : "default";
    return;
  }
  const photo = photos[drag.i];
  // dragging the photo right/down reveals more of its left/top, so the focus moves the opposite way
  const dx = (p.x - drag.startX) / drag.scale;
  const dy = (p.y - drag.startY) / drag.scale;
  if (drag.rangeX > 0.5) photo.fx = clamp(drag.fx - dx / drag.rangeX, 0, 1);
  if (drag.rangeY > 0.5) photo.fy = clamp(drag.fy - dy / drag.rangeY, 0, 1);
  drawCollage();
});

function endDrag(e) {
  if (!drag) return;
  drag = null;
  canvas.style.cursor = "grab";
  if (canvas.hasPointerCapture(e.pointerId)) canvas.releasePointerCapture(e.pointerId);
}
canvas.addEventListener("pointerup", endDrag);
canvas.addEventListener("pointercancel", endDrag);

resetBtn.addEventListener("click", () => {
  photos.forEach((p) => { p.fx = 0.5; p.fy = 0.5; });
  if (photos.length >= MIN_PHOTOS) drawCollage();
});

function refresh() {
  renderThumbs();
  const n = photos.length;
  clearBtn.disabled = n === 0;
  const ready = n >= MIN_PHOTOS && n <= MAX_PHOTOS;

  if (n === 0) setStatus(`No photos yet (need ${MIN_PHOTOS}–${MAX_PHOTOS}).`);
  else if (n < MIN_PHOTOS) setStatus(`${n} photo(s) added — add at least ${MIN_PHOTOS - n} more.`);
  else setStatus(`${n} photos — using a ${n}-photo template.`, "ok");

  wrap.classList.toggle("ready", ready);
  downloadBtn.disabled = !ready;
  shuffleBtn.disabled = !ready;
  resetBtn.disabled = !ready;
  if (ready) drawCollage();
}

function download() {
  canvas.toBlob((blob) => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "collage.png";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }, "image/png");
}

fileInput.addEventListener("change", () => { addFiles(fileInput.files); fileInput.value = ""; });
["dragenter", "dragover"].forEach((ev) =>
  dropzone.addEventListener(ev, (e) => { e.preventDefault(); dropzone.classList.add("drag"); }));
["dragleave", "drop"].forEach((ev) =>
  dropzone.addEventListener(ev, (e) => { e.preventDefault(); dropzone.classList.remove("drag"); }));
dropzone.addEventListener("drop", (e) => addFiles(e.dataTransfer.files));

gapInput.addEventListener("input", () => photos.length >= MIN_PHOTOS && drawCollage());
bgInput.addEventListener("input", () => photos.length >= MIN_PHOTOS && drawCollage());
shuffleBtn.addEventListener("click", () => { variant++; drawCollage(); });
clearBtn.addEventListener("click", () => {
  photos.forEach((p) => URL.revokeObjectURL(p.url));
  photos = [];
  variant = 0;
  refresh();
});
downloadBtn.addEventListener("click", download);

refresh();
  </script>
</body>
</html>
